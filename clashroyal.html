<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clash Royal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden; /* Prevents scrollbars */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .iframe-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border: none;
      transform: scale(0.95); /* Adjust to fit the entire content */
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <iframe 
      src="https://www.greenfoot.org/scenarios/27793?embed=true" 
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
